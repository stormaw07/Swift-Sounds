<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Sounds</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.typekit.net/lxm7zsb.css"> <!--Alle adobe fonts-->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/soulmate"> <!--Lover-->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satisfaction"> <!--Taylor Swift-->
</head>
<body>
    <header>
        <div id="name">
            <h1 class="headerText" id="swiftSounds">Swift Sounds</h1>
        </div>
        <div id="info">
            <div class="dropdown">
                <button onclick="dropDownMenuMusic()" class="headerInfo" id="headerMusic">
                    <h2 id="downArrow" class="headerText">Music</h2>
                    <p><i class="arrow down"></i></p>
                </button>
                <div id="dropdownMusic" class="dropdownContent">
                    <a href="./album_pages/debut/"><p id="debut">Taylor Swift</p></a>
                    <a href="./album_pages/fearless/"><p id="fearless">Fearless</p></a>
                    <a href="./album_pages/speak_now/"><p id="speakNow">Speak Now</p></a>
                    <a href="./album_pages/red/"><p id="red">RED</p></a>
                    <a href="./album_pages/1989/"><p id="nineteen89">1989</p></a>
                    <a href="./album_pages/reputation/"><p id ="reputation">reputation</p></a>
                    <a href="./album_pages/lover/"><p id="lover">Lover</p></a>
                    <a href="./album_pages/folklore/"><p id="folklore">folklore</p></a>
                    <a href="./album_pages/evermore/"><p id="evermore">evermore</p></a>
                    <a href="./album_pages/Midnights/"><p id="midnights">Midnights</p></a>
                    <a href="./album_pages/TTPD/"><p id="ttpd">The Tortured Poets Department</p></a>
                </div>
            </div>
            <button class="headerInfo" id="headerGames">
                <h2 class="headerText">Games</h2>
                <p><i class="arrow down"></i></p>
            </button>

            <div id="dropdown">
                <button onclick="dropDownMenuAccount()" class="headerInfo" id="headerAccount">
                    <h2 class="headerText">Account</h2>
                    <p><i class="arrow down"></i></p>
                </button>
                <div id="dropDownAccount" class="dropdownContent">
                    <a href="./login/log-in/"><p class="accountText">Log In</p></a>
                    <a href="./login/create-user/"><p class="accountText">Create User</p></a>
                </div>
            </div>
        </div>
   </header>

    <div id="forside">
        <img id="forsideBilde" src="./pictures/bluedress_background.webp"/>
        <div id="sloganBox">
            <p id="slogan">The space for everything<br>Taylor swift related</p>
        </div>
    </div>

    <div id="gameContainer">
        <button onclick="pickRandomSong()" id="pickSongButton">Pick Random Song</button>
        <input type="text" id="guess" placeholder="Guess the song!" autocomplete="off">
    </div>


   <script src="./server.js"></script>
   <script src="./script.js"></script>
</body>
</html>
