<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Merch - Music</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="https://use.typekit.net/lxm7zsb.css"> <!--Alle adobe fonts-->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/soulmate"> <!--Lover-->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satisfaction"> <!--Taylor Swift-->
</head>
<body onload="getMerchItems('music')">
  <!-- Header -->
    <header>
        <div id="name">
            <a href="/"><h1 class="headerText" id="swiftSounds">Swift Sounds</h1></a>
        </div>
        <div id="info">
            <div>
                <button onclick="dropDownMenuMusic()" class="headerInfo" id="headerMusic">
                <h2 id="downArrow" class="headerText">Music</h2>
                <p><i class="arrow down"></i></p>
                </button>
                <div id="dropdownMusic" class="dropdownContent">
                    <a href="../../album_pages/debut/"><p id="debut">Taylor Swift</p></a>
                    <a href="../../album_pages/fearless/"><p id="fearless">Fearless</p></a>
                    <a href="../../album_pages/speak_now/"><p id="speakNow">Speak Now</p></a>
                    <a href="../../album_pages/red/"><p id="red">RED</p></a>
                    <a href="../../album_pages/1989/"><p id="nineteen89">1989</p></a>
                    <a href="../../album_pages/reputation/"><p id="reputation">reputation</p></a>
                    <a href="../../album_pages/lover/"><p id="lover">Lover</p></a>
                    <a href="../../album_pages/folklore/"><p id="folklore">folklore</p></a>
                    <a href="../../album_pages/evermore/"><p id="evermore">evermore</p></a>
                    <a href="../../album_pages/midnights/"><p id="midnights">Midnights</p></a>
                    <a href="../../album_pages/TTPD/"><p id="ttpd">The Tortured Poets Department</p></a>
                </div>
            </div>

            <div>
                <button onclick="dropDownMenuMerch()" class="headerInfo" id="headerMerch">
                <h2 class="headerText">Merch</h2>
                <p><i class="arrow down"></i></p>
                </button>
                <div id="dropDownMerch" class="dropdownContent">
                    <a href="../music/"><p class="dropDownText">Music</p></a>
                    <a href="../other/"><p class="dropDownText">Other</p></a>
                    <a href="../cart/"><p class="dropDownText">Cart</p></a>
                </div>
            </div>

            <div>
                <button onclick="dropDownMenuAccount()" class="headerInfo" id="headerAccount">
                <h2 class="headerText">Account</h2>
                <p><i class="arrow down"></i></p>
                </button>
                <div id="dropDownAccount" class="dropdownContent">
                    <a href="../../login/log-in/"><p class="dropDownText">Log In</p></a>
                    <a href="../../login/create-user/"><p class="dropDownText">Create User</p></a>
                </div>
            </div>
        </div>
    </header>

  <!-- Shop layout -->
    <div class="shop-container">
        <div class="product-grid" id="shopItems">
            
            <div class="product-card">
                <div class="image-container">
                    <img src="https://www.platekompaniet.no/pimcorecdn/Products/Music/LP/LPF/0843930021154.png?auto=webp&format=png&width=960&height=960&fit=cover" alt="Product 1">
                </div>
                <h2>Taylor Swift</h2>
                <p class="price">500 kr</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <div class="image-container">
                    <img src="https://images.squarespace-cdn.com/content/v1/5f4a6763a23dbb3ab86255f7/324e02e6-482d-4623-8a20-6df32f9646c5/91.png" alt="Product 2">
                </div>
                <h2>Fearless</h2>
                <p class="price">400 kr</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <div class="image-container">
                    <img src="https://store.taylorswift.com/cdn/shop/files/xDn4hZFEqGdJ30xLjXeL6AXpNLxj3rS8.png?v=1744214271&width=550" alt="Product 3">
                </div>
                <h2>Fearless (Taylor's Version)</h2>
                <p class="price">500</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
       
        </div>
    </div>

  <script src="../../script.js"></script>
  <script src="../script.js"></script>
</body>
</html>
