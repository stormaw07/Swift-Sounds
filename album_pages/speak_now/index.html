<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak Now</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://use.typekit.net/lxm7zsb.css"> <!--Alle adobe fonts-->
</head>
<body onload="getAlbumData(2)">
    <button id="speaknowback" class="back-button" onclick="window.location.href='/'">← Back</button>
    <div class="album-container">
        <div class="album-header">
            <img id="bilde" alt="Speak Now Album Cover" class="album-cover">
            <div class="album-details">
                <p id="album-label"></p>
                <p id="album-title"></p>
                <p class="album-meta">Taylor Swift • 2023 • 22 songs, 1 h 44 min</p>
                <div class="album-actions">
                    <button id="speaknowplay" onclick="startPlaybackOnDevice(2,0)" class="play-button" >▶ Play</button>
                    <button id="speaknowshuffle" onclick="playAlbumShuffled(2)" class="shuffle-button">🔀 Shuffle</button>
                </div>
            </div>
        </div>
        <div class="tracklist">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="tracklist">
                </tbody>
            </table>
        </div>
    </div>
    <script src="../../server.js"></script>
</body>
</html>
