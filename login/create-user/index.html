<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create user</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="form">
        <div id="step1">
            <h1>Create user:</h1>
            <input type="text" id="epost" placeholder="email">
            <p id="epostFeil"></p>
            <input type="password" id="passord1" placeholder="password">
            <input type="password" id="passord2" placeholder="confirm password">
            <p id="passordFeil"></p>
            <button disabled>Next</button>
        </div>
        <div id="step2">
            <h1>Client ID & Client Secret</h1>
            <div>
                <p>tutorial</p>
            </div>
            <input type="text" id="clientID" placeholder="client id">
            <input type="text" id="clientSecret" placeholder="client secret">
            <button disabled>Next</button>
        </div>
        <div id="step3">
            <h1>Refresh Token</h1>
            <div>
                <p>tutorial</p>
            </div>
            <input type="text" id="refreshToken" placeholder="refresh token">
            <button disabled>Next</button>
        </div>
        <div id="step4">
            <h1>Device ID</h1>
            <div>
                <p>tutorial</p>
            </div>
            <input type="text" id="deviceID" placeholder="device id">
            <button>Create user</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
